          format: date-time
          readOnly: true
          description: The last time at which the Jump Client connected to the appliance.
        last_disconnect_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: The last time at which the Jump Client disconnected from the appliance. If empty then the Jump Client has never disconnected.
        is_lost:
          type: boolean
          readOnly: true
          description: "For active Jump Clients, this is true when the Jump Client has been disconnected for longer than the number of days configured for the 'lost' setting on the /login → Jump → Jump Clients page. For standby Jump Clients, this is true when the Jump Client has not checked in for longer than the number of days configured for the 'lost' setting on the /login → Jump → Jump Clients page."
        needs_update:
          type: boolean
          readOnly: true
          description: If true, this Jump Client is running an older version of the software and needs to be updated. Sessions cannot be started with this Jump Client until it is upgraded to the latest version.
        unavailable_reason:
          type: string
          readOnly: true
          description: "The reason why the Jump Client cannot be used to start sessions. Disabled indicates the end user disabled the Jump Client on their system."
          enum: [none, disabled]
        operating_system:
          type: string
          readOnly: true
          description: The name, version, and platform of the operating system on which the Jump Client is running.
        public_ip:
          type: string
          readOnly: true
          description: The public IP address of the system on which the Jump Client is running.
        private_ip:
          type: string
          readOnly: true
          description: The private IP address of the system on which the Jump Client is running.
        console_user:
          type: string
          readOnly: true
          description: The username of the user is logged on to the system on which the Jump Client is running.
        expiration_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: The date/time at which the Jump Client will automatically uninstall itself.
        max_offline_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: The maximum number of minutes the Jump Client can be offline before being uninstalled. If 0, this Jump Client follows the global lost client settings.
        last_access_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: The last time at which this Jump Client was used to start a session.
        endpoint_agreement_policy:
          type: string
          description: >
            The value `accept` will automatically accept the endpoint agreement if it times out and allow the session to start.
            The value `reject` will automatically reject the endpoint agreement and stop the session from starting.
            The value `no_prompt` will not show an endpoint agreement even if the feature is configured.
            This field has no effect if the global endpoint agreement setting is not enabled.

            This field is only available for `GET` and `PATCH` requests.
          enum: [no_prompt, accept, reject]
      required:
        - jump_group_id

