    ScheduleEntry:
      type: object
      properties:
        start_day:
          type: integer
          description: "An integer representing a day of the week. Must be one of the following integers: 0 = Monday. 1 = Tuesday. 2 = Wednesday. 3 = Thursday. 4 = Friday. 5 = Saturday. 6 = Sunday."
          minimum: 0
          maximum: 6
        start_time:
          type: string
          description: "A string in the format 'HH:MM' representing a time of day: HH must be an integer in the range 0-23, inclusive, representing the hour of the day. MM must be an integer in the range 0-59, inclusive, representing the minute of the hour."
          pattern: ^\d\d:\d\d$
        end_day:
          type: integer
          description: "An integer representing a day of the week. Must be one of the following integers: 0 = Monday. 1 = Tuesday. 2 = Wednesday. 3 = Thursday. 4 = Friday. 5 = Saturday. 6 = Sunday."
          minimum: 0
          maximum: 6
        end_time:
          type: string
          description: "A string in the format 'HH:MM' representing a time of day: HH must be an integer in the range 0-23, inclusive, representing the hour of the day. MM must be an integer in the range 0-59, inclusive, representing the minute of the hour."
          pattern: ^\d\d:\d\d$

    VaultAccount:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to this Account by the system.
        type:
          type: string
          enum: [username_password, ssh, ssh_ca, windows_local, windows_domain, opaque_token, x509_ca, x509_csr, aws_secret, password_safe]
          readOnly: true
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The name of the Account.
        description:
          type: string
          maxLength: 4096
          description: The Account's description.
        personal:
          type: boolean
          description: Indicates if this is a personal account.
          readOnly: true
        owner_user_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier of a user who owns the personal account.
        account_group_id:
          default: 1
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The unique identifier of the Vault Account Group. For most account types, the `account_group_id` defaults to `1`, which is the default Account Group. If the `type` is `x509_ca`, or the account is personal, account_group_id will not be present.
        account_policy:
          type: string
          maxLength: 64
          minLength: 1
          nullable: true
          description: The code name of the Account Policy associated with the account. When the value is `null`, the account policy is inherited from the account group. If there is no account group, it is inherited from the global default.
    VaultAccountGroup:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to this Account Group by the system.
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The name of the Account Group. This value must be unique.
        description:
          type: string
          maxLength: 1024
          description: The Account Group's description.
        account_policy:
