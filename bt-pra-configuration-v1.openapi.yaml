  /jumpoint:
    get:
      summary: Get all Gateways.
      description: |
        Gets a paginated list of Gateways.

        They can optionally be filtered using query string parameters documented below. If no filter criteria are specified then all Gateways are returned. If more than one criteria is specified then AND logic is used to combine the criteria. String parameters are always matched case-insensitively and exactly. No partial matches are allowed.

        If a clustered Gateway has multiple nodes then all nodes are searched for matching criteria. Node resources are not returned in the response.
      operationId: api.config.jumpoint.index
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CurrentPageParam'
        - in: query
          name: name
          description: Filters results to include only Gateways with the given name.
          schema:
            type: string
        - in: query
          name: public_ip
          description: Filters results to include only Gateways with a node that has the specified public IP.
          schema:
            type: string
        - in: query
          name: private_ip
          description: Filters results to include only Gateways with a node that has the specified private IP.
          schema:
            type: string
        - in: query
          name: hostname
          description: Filters results to include only Gateways with a node that has the specified hostname.
          schema:
            type: string
        - $ref: '#/components/parameters/CodeNameParam'
      responses:
        '200':
          description: OK
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-BT-Pagination-Current-Page:
              $ref: '#/components/headers/X-BT-Pagination-Current-Page'
            X-BT-Pagination-Per-Page:
              $ref: '#/components/headers/X-BT-Pagination-Per-Page'
            X-BT-Pagination-Last-Page:
              $ref: '#/components/headers/X-BT-Pagination-Last-Page'
            X-BT-Pagination-Total:
              $ref: '#/components/headers/X-BT-Pagination-Total'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jumpoint'
    post:
      summary: Adds a new Gateway.
      description: Creates a new Gateway with the properties given in the request body.
      operationId: api.config.jumpoint.store
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jumpoint'
      responses:
        '201':
          description: Indicates the Gateway was created successfully and contains the new instance. The `Location` header contains the URL of the new Gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jumpoint'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /jumpoint/{id}:
    get:
      summary: Get a Gateway.
      description: Gets the Gateway resource with the given `{id}`.
      operationId: api.config.jumpoint.show
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jumpoint'
