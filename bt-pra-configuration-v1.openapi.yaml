  /vault/account-group/{id}/jump-item-association:
    get:
      summary: Get Asset association criteria for an Account Group.
      description: Get the Asset association criteria for the Account Group with the given `{id}`.
      operationId: api.config.vault.account-group.jump-item-association.show
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpItemAssociation'
    patch:
      summary: Update the Asset association criteria for an Account Group.
      description: |
        Update the Asset association criteria for the Account Group with the given `{id}` using the data in the request body.

        You may change either or both of the `filter_type` and `criteria` properties of the association object in a single request, but `criteria` will be ignored if the `filter_type` is not set to "criteria". Updating `filter_type` from "criteria" to "any_jump_items" or "no_jump_items" implicitly deletes all previous `criteria` for the account group.

        You may specify some or all of the available `criteria` properties. Each `criteria` property you supply will *replace* the previous value for that property. To keep the existing values for a certain property, omit that property from the request. Separate APIs exist for adding or deleting single Assets or shared Asset Groups, which might be preferable to supplying the entire array of ids with this API:

        - <a href="#api.config.vault.account-group.jump-item-association.jump-item.store">Add a single Asset to `jump_items`.</a>
        - <a href="#api.config.vault.account-group.jump-item-association.jump-item.destroy">Remove a single Asset from `jump_items`.</a>
        - <a href="#api.config.vault.account-group.jump-item-association.shared-jump-group.store">Add a single Asset Group to `shared_jump_groups`.</a>
        - <a href="#api.config.vault.account-group.jump-item-association.shared-jump-group.destroy">Remove a single Asset Group from `shared_jump_groups`.</a>
      operationId: api.config.vault.account-group.jump-item-association.update
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountJumpItemAssociation'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpItemAssociation'
  /vault/account-group/{id}/jump-item-association/jump-item:
    post:
      summary: Add an Asset to an Account Group's Asset association criteria.
      description: |
        Adds a specific Asset identified in the request body to the Asset association criteria of the Account Group with the given `{id}`.

        The Account Group's Asset association must have its `filter_type` set to "criteria".

        Currently Remote Assets cannot be added.
      operationId: api.config.vault.account-group.jump-item-association.jump-item.store
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        description: Identifies the Asset to add.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInjectableJumpItem'
        required: true
      responses:
        '200':
          description: Indicates the Asset was successfully added to the Account Group's Asset association criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInjectableJumpItem'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    delete:
      summary: Remove an Asset from an Account Group's Asset association criteria.
      description: |
        Removes a specific Asset identified in the request body from the Asset association criteria of the Account Group with the given `{id}`.

        The Account Group's Asset association must have its `filter_type` set to "criteria".
      operationId: api.config.vault.account-group.jump-item-association.jump-item.destroy
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        description: Identifies the Asset to remove.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInjectableJumpItem'
        required: true
      responses:
        '204':
          description: Indicates the Asset was successfully removed from the Account Group's Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
  /vault/account-group/{id}/jump-item-association/shared-jump-group:
    post:
      summary: Add a shared Asset Group to an Account Group's Asset association criteria.
      description: |
        Adds a specific shared Asset Group identified by `shared_jump_group_id` in the request body to the Asset association criteria of the Account Group with the given `{id}`.

        The Account Group's Asset association must have its `filter_type` set to "criteria".
      operationId: api.config.vault.account-group.jump-item-association.shared-jump-group.store
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountJumpGroupAssociationItem'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Indicates the shared Asset Group was successfully added to the Account Group's Asset association criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpGroupAssociationResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    delete:
      summary: Remove a shared Asset Group from an Account Group's Asset association criteria.
      description: |
        Removes a specific shared Asset Group identified by `{shared_jump_group_id}` from the Asset association criteria of the Account Group with the given `{id}`.

        The Account Group's Asset association must have its `filter_type` set to "criteria".
      operationId: api.config.vault.account-group.jump-item-association.shared-jump-group.destroy
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shared_jump_group_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Unique identifier for the shared Asset Group.
        required: true
      responses:
        '204':
          description: Indicates the shared Asset Group was successfully removed from the Account Group's Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

