          description: Unix timestamp (in seconds) when the authorization ends. Equal to start_timestamp + duration. Null if start_timestamp is null.
        time_remaining_seconds:
          type: integer
          minimum: 0
          description: Number of seconds remaining until the session expires. Zero if expired.
        expired:
          type: boolean
          description: Whether the session authorization has expired.


