  /jumpoint/{id}/installer:
    get:
      summary: Get the 64-bit installer for a Gateway resource.
      description: For non-clustered Gateways, this API returns an error if a node is currently associated with the given Gateway. If a non-clustered Gateway already has a node then that node must be deleted before calling this API. For clustered Gateways, only 10 nodes can be installed. If this API is called when a clustered Gateway already has 10 nodes then an error is returned.
      operationId: api.config.jumpoint.download
