    Vendor:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to the vendor group by the system.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the vendor group.
        default_policy:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The group policy id associated with the vendor group. The group policy cannot grant administrative privileges.
        account_expiration:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 30
          description: The number of days until a new user account expires in the vendor group.
        deletion_days_after_expiration:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: null
          nullable: true
          description: After an account expires, the system will automatically delete the account after this many days. Omit this field or set it to null if you do not want expired accounts to be automatically deleted.
        user_added_notification_enabled:
          type: boolean
          default: true
          description: If enabled, the %ABR_BeyondTrust Privileged Remote Access% users and/or team members are emailed when a user is added to the vendor group. This value cannot be false if `user_approval_enabled` is true. At least one administrator or team must be set in `administrator_ids` or `team_ids` respectively if this value is true.
        user_expired_notification_enabled:
          type: boolean
          default: true
          description: If enabled, the %ABR_BeyondTrust Privileged Remote Access% users and/or team members are emailed when a user has expired or has been automatically deleted in this vendor group. At least one administrator or team must be set in `administrator_ids` or `team_ids` respectively if this value is true.
        user_approval_enabled:
          type: boolean
          default: false
          description: If enabled, approval by a %ABR_BeyondTrust Privileged Remote Access% users and/or team members are required to activate users in the vendor group. At least one administrator or team must be set in `administrator_ids` or `team_ids` respectively if this value is true.
        user_reactivation_enabled:
          type: boolean
          default: false
          description: If enabled, approval by a %ABR_BeyondTrust Privileged Remote Access% users and/or team members are required to extend or reactivate users in the vendor group. `user_approval_enabled` must first be enabled.
        administrator_ids:
            type: array
            description: >
              List of ids of the %ABR_BeyondTrust Privileged Remote Access% users who are emailed if notifications are enabled or user approvals are required.
              To receive emails, each user must have a valid email address, and the site must have an SMTP server configured on the Management > Email Configuration page.
              The sum of administrator_ids and team_ids is not allowed to exceed 10.
            default: [ ]
            minItems: 0
            maxItems: 10
            items:
              $ref: '#/components/schemas/ObjectId'
        team_ids:
          type: array
          description: >
            List of ids of the %ABR_BeyondTrust Privileged Remote Access% teams whose members are emailed if notifications are enabled or user approvals are required.
            To receive emails, each team member must have a valid email address, and the site must have an SMTP server configured on the Management > Email Configuration page.
            The sum of administrator_ids and team_ids is not allowed to exceed 10.
          default: [ ]
          minItems: 0
          maxItems: 10
          items:
            $ref: '#/components/schemas/ObjectId'
        network_restrictions:
          type: array
          description: The network address allow list related to network restrictions.
          default: []
          minItems: 0
          maxItems: 128
          items:
            type: string
        duration:
          type: integer
          description: The duration in hours after which the %ABR_BeyondTrust Privileged Remote Access% users and/or team members are emailed if there are users awaiting action.
          default: 24
          minimum: 1
          maximum: 168
        duration_enabled:
          type: boolean
          default: false
          description: If enabled, the %ABR_BeyondTrust Privileged Remote Access% users and/or team members are emailed depending on the duration if there are users awaiting action.
      required:
        - name
        - default_policy

    VendorUser:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to the vendor user by the system.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: The username of the vendor user.
        public_display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: The public display name of the vendor user.
        password:
          type: string
          minLength: 1
          maxLength: 255
          description: The password of the vendor user.
        password_expiration:
          type: string
          format: date-time
          nullable: true
          description: >
            The date and time at which the vendor user's password will expire as an RFC3339 date-time
            string. If not set or set to a null or empty value, then the vendor user's password never
            expires.
        password_reset_next_login:
          type: boolean
          default: false
          description: >
            If true, this vendor user's password must be reset on their next login.
        account_expiration:
          type: string
          format: date-time
          readOnly: true
          description: >
            The date and time at which the vendor user's account will expire as an RFC3339 date-time string.
        enabled:
          type: boolean
          default: true
          description: If false, the vendor user is not allowed to log in.
        email_address:
          type: string
          minLength: 1
          maxLength: 256
          description: The email address of the vendor user.
        preferred_email_language:
          type: string
          default: en-us
          maxLength: 10
          minLength: 2
          description: Must be the locale code for one of the locales listed on the Localization → Languages page.
        last_authenticated_date:
          type: string
          format: date-time
          readOnly: true
          description: The last authentication date of the vendor user. This attribute is read-only.
        vendor_administrator:
          type: boolean
          readOnly: true
          description: If true, the vendor user is a vendor administrator. This attribute is read-only.
        is_approved:
          type: boolean
          readOnly: true
          description: If true, the vendor user has been approved and can authenticate. This attribute is read-only.
        is_expired:
          type: boolean
          readOnly: true
          description: If true, the vendor user is expired and must be reactivated. This attribute is read-only.
        two_factor_enabled:
          type: boolean
          readOnly: true
          description: If true, this vendor user has enabled two-factor authentication.
        fido2_credential_count:
          type: integer
          format: int32
          readOnly: true
          description: The number of FIDO2 credentials registered for this vendor user. (This field is only available if "Enable Passwordless FIDO2 Authentication" is enabled under Management -> security)
        fido2_last_used_date:
          type: string
          format: date-time
          readOnly: true
          description: The date and time at which the vendor user last used a FIDO2 credential to authenticate. (This field is only available if "Enable Passwordless FIDO2 Authentication" is enabled under Management -> security)
      required:
        - username
        - public_display_name
        - password
        - email_address


