          type: integer
          format: int32
          nullable: true
          minimum: 2
          maximum: 2147483647
          description: The unique identifier of the Session Policy used to control the user's capabilities in the session.
        filter_rules:
          type: array
          minItems: 1
          maxItems: 50
          description: Array of filter rules.
          items:
            $ref: '#/components/schemas/NetworkTunnelJumpItemFilterRule'
      required:
        - name
        - jumpoint_id
        - jump_group_id
        - filter_rules

    NetworkTunnelJumpItemFilterRuleIPAddressCIDR:
      type: object
      properties:
        cidr:
          type: string
          description: CIDR notation for IP addresses that are allowed ingress to the tunnel.
          example: "192.168.1.0/24"
      required:
        - cidr

    NetworkTunnelJumpItemFilterRuleIPAddressRange:
      type: object
      description: Range of consecutive IPv4 addresses that are allowed ingress to the tunnel.
      properties:
        range:
          type: object
          properties:
            start:
              type: string
              description: First IPv4 address in the range.
            end:
              type: string
              description: Last IPv4 address in the range.
          required:
            - start
            - end
      example: '{ "range": { "start": "192.168.1.1", "end": "192.168.1.20" } }'
      required:
        - range

    NetworkTunnelJumpItemFilterRuleIPAddressList:
      type: object
      description: List of IPv4 addresses that are allowed ingress to the tunnel.
      properties:
        list:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            description: An IPv4 address.
      example: '{ "list": ["192.168.1.1", "192.168.1.20"] }'

    NetworkTunnelJumpItemFilterRulePortRange:
      type: object
      description: Range of ports (inclusive) that are allowed ingress to the tunnel.
      properties:
        range:
          type: object
          properties:
            start:
              type: integer
              minimum: 1
              maximum: 65535
            end:
              type: integer
              minimum: 1
              maximum: 65535
          required:
            - start
            - end
      example: '{ "range": { "start": 9000, "end": 9999 } }'
      required:
        - range

    NetworkTunnelJumpItemFilterRulePortList:
      type: object
      description: List of ports that are allowed ingress to the tunnel. If the list is an empty array, any port is allowed.
      properties:
        list:
          type: array
          minItems: 0
          maxItems: 42
          items:
            type: integer
            minimum: 1
            maximum: 65535
      example:
        - '{ "list": [8000, 8999, 9000] }'
        - '{ "list": [8080] }'
        - '{ "list": [] }' # This means any port is allowed.

    NetworkTunnelJumpItemFilterRule:
      type: object
      properties:
        ip_addresses:
          oneOf:
            - $ref: '#/components/schemas/NetworkTunnelJumpItemFilterRuleIPAddressCIDR'
            - $ref: '#/components/schemas/NetworkTunnelJumpItemFilterRuleIPAddressRange'
            - $ref: '#/components/schemas/NetworkTunnelJumpItemFilterRuleIPAddressList'
        protocol:
          type: string
