    JumpAuthorizationSessionStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The unique identifier assigned to this Asset Authorization Request.
        state:
          type: string
          enum: [approved, in_use]
          description: The current state of the session authorization.
        jump_item_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The Asset's id.
        jump_item_type:
          type: string
          description: The Asset's type.
        jump_policy_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The id of the Asset Policy this request was caused by.
        created_by_user_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The id of the User who made the request.
        start_timestamp:
          type: integer
          nullable: true
          description: Unix timestamp (in seconds) when the authorization starts. Null if the start time could not be determined.
        duration:
          type: integer
          minimum: 60
          maximum: 2147483647
          description: The duration (in seconds) following the start_timestamp, after which the authorization ends.
        end_timestamp:
