          description: The last time at which this node connected to the appliance. The time is in UTC.
        last_disconnect_timestamp:
          type: string
          format: date-time
          nullable: true
          description: The last time at which this node disconnected from the appliance. The time is in UTC.
        public_ip:
          type: string
          maxLength: 45
          minLength: 1
          description: The public IP address of the system on which the node is running.
        private_ip:
          type: string
          maxLength: 45
          minLength: 1
          description: The private IP address of the system on which the node is running.
        hostname:
          type: string
          maxLength: 255
          minLength: 1
          description: The hostname of the system on which the node is running.

    JumpointUser:
      type: object
      properties:
        user_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier of the user who has access to the Gateway.

    JumpPolicy:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to this Asset Policy by the appliance.
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          description: The display name of the Asset Policy.
        code_name:
          type: string
          maxLength: 64
          minLength: 0
          pattern: '^[a-zA-Z0-9_\\-]+$'
          description: The code name of the Asset Policy.
        description:
          type: string
          maxLength: 1000
          description: The Asset Policy's comments.
        schedule_enabled:
          type: boolean
          default: true
          description: If true, users are restricted to accessing Assets within the scheduled hours. This setting cannot be enabled when require_approval is true.
        simultaneous_jumps:
            description: >
              If set to `join`, once the first user is in a session, subsequent users will be able to enter the session. The first user will receive a notification that another user has joined the session, but the first user will not have an opportunity to deny access before other user joins.
              Selecting the `global` value means that the behavior defined under Asset Management -> Assets will be used.
            type: string
            default: global
            enum: [global, join, disallow]
        simultaneous_jump_behavior_applies_to_copies:
          description: >
            This field is only valid if simultaneous_jumps is set to join; otherwise, this field should be set to false or left unset.
            If `true`, a user will be allowed to join a session that was started from another copy of a Jump Client in a different Asset Group. Session permissions will be based on the original Jump Client that started the session.
            If `false`, a user will not be allowed to join a session that was started from another copy of an Asset unless it is the same Asset Group.
          type: boolean
          default: false
        simultaneous_jumps_rdp:
          description: >
            If set to `new_session`, then a new independent session will start for each user which jumps to a specific RDP Asset, and the RDP configuration on the endpoint will control any further behavior regarding simultaneous RDP connections.
            Selecting the `global` value means that the behavior defined under Asset Management -> Assets will be used.
          type: string
          default: global
          enum: [global, new_session, disallow]
        external_tools_rdp_allowed:
          description: If `true`, this will follow the global setting behavior for Remote RDP Assets defined under Asset Management -> Assets.
            If the global setting allows opening Remote RDP Assets with external tools, then users can open them. Otherwise, users cannot open them.
            If `false`, this will prevent users from opening them with external tools regardless of the global setting.
          type: boolean
          default: true
        external_tools_shell_allowed:
          description: If `true`, this will follow the global setting behavior for Shell sessions defined under Asset Management -> Assets.
            If the global setting allows opening Shell sessions with external tools, then users can open them. Otherwise, users cannot open them.
            If `false`, this will prevent users from opening them with external tools regardless of the global setting.
          type: boolean
          default: true
        schedule_strict:
          type: boolean
          default: false
          description: If true, users are forcefully removed from sessions when the schedule does not permit access. This can only be set to true if schedule_enabled is also true.
        context_requirement:
          type: string
          enum:
            - none
            - ticket_id
            - justification
          default: none
          description: |
            Controls whether a user must provide context before starting a session on an Asset.
            * `none` — no context required.
            * `ticket_id` — user must enter a valid ticket ID that will be verified against the Ticket System configured on the Asset Management → Asset Policies page. The setting has no effect if a Ticket System is not configured.
            * `justification` — user must enter a written justification for starting the session, which is logged for auditing.

            Replaces the legacy boolean `ticket_id_required`. The API still accepts `ticket_id_required` on ingress (`true` → `ticket_id`, `false` → `none`), but the field is no longer returned in responses.
        two_factor_challenge_required:
          type: boolean
          default: false
          description: If true, users must have two-factor authentication enabled and must complete a two-factor challenge before starting a session.
        session_start_notification:
          type: boolean
          default: false
          description: If true, an email notification is sent to the configured recipients when a session starts.
        session_end_notification:
          type: boolean
          default: false
          description: If true, an email notification is sent to the configured recipients when a session ends.
        notification_email_addresses:
          type: array
          default: []
          minItems: 0
          maxItems: 100
          description: The list of email addresses to which session start and session end notifications will be sent. Required only if one or more notifications are enabled. The site must have an SMTP server configured on the Management > Email Configuration page.
          items:
            type: string
        notification_display_name:
          type: string
          maxLength: 255
          description: The display name of the recipients shown to users. Required in POST only if one or more notifications are enabled.
        notification_email_language:
          type: string
          default: 'en-us'
          description: The language in which notification emails will be sent. Must be the locale code for one of the locales listed on the Localization → Languages page.
        approval_required:
          type: boolean
          default: false
          description: If true, users must wait for approval from one of the approvers before they can start a session. This setting cannot be enabled when `schedule_enabled` is true.
        approval_max_duration:
          type: integer
          format: int32
          default: 480
          minimum: 1
          maximum: 524160
          description: The number of minutes a user is allowed to access the Asset after approval is granted. The maximum is 52 weeks in minutes.
        approval_scope:
          type: string
          default: "requestor"
          description: The scope of access granted by approvals. If "requestor", only the requestor has access. If "anyone", anyone who is permitted to request access has access.
          enum: [requestor, anyone]
        approval_email_addresses:
          type: array
          default: []
          minItems: 0
          maxItems: 100
          description: The list of email addresses to which approval requests will be sent. It is required only if approvals are enabled. The site must have an SMTP server configured on the Management > Email Configuration page.
          items:
            type: string
        approval_user_ids:
          type: array
          default: []
          minItems: 0
          maxItems: 100
          description: The list of user ids to which approval requests will be sent. It is required only if approvals are enabled.
          items:
            type: string
        approval_team_ids:
          type: array
          default: []
          minItems: 0
          maxItems: 100
          description: The list of team ids to which approval requests will be sent. It is required only if approvals are enabled.
          items:
            type: string
        approval_display_name:
          type: string
          maxLength: 255
          description: The display name of the approvers that requestors will see. It is required only if approvals are enabled.
        approval_email_language:
          type: string
          default: "en-us"
          description: The language in which approval emails will be sent. Must be the locale code for one of the locales listed on the Localization → Languages page.
        approval_approver_scope:
          type: string
          default: "not_requestor"
          description: The scope of approval granted to approvers. If "not_requestor", then the approver cannot approve their own requests. If "anyone", anyone who is permitted to approve, can approve requests, including their own.
          enum: [not_requestor, anyone]
        recordings_disabled:
          type: boolean
          default: false
          description: If true, sessions will not be recorded even if recordings are enabled on the Configuration → Options page. This affects Screen Sharing, User Recordings for Protocol Tunnel Jump, and Shell recordings
      required:
        - display_name

    JumpAuthorizationRequest:
