        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    patch:
      summary: Update properties on a Gateway resource.
      description: Modifies an existing Gateway resource with the given `{id}` using the given properties. The clustered attribute cannot be modified with this API.
      operationId: api.config.jumpoint.update
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        description: The Gateway properties to modify.
        content:
          application/json:
