      operationId: api.config.jump-approval.index
      parameters:
        - in: path
          name: user_id
          description: The unique id of the User.
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: query
          name: state
          description: The state of the Asset Authorization Request
          schema:
            type: string
            enum: [pending, approved, denied, cancelled, in_use]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JumpAuthorizationRequest'
  /jump-approval/{user_id}/view/{id}:
    get:
      summary: Get the Asset Authorization Request that a user is an approver for.
      description: Gets an Asset Authorization Request resource with the given {id} that a user with the given {user_id} is an approver for.
      operationId: api.config.jump-approval.view
      parameters:
        - in: path
          name: user_id
          description: The unique id of the User.
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: id
          description: The unique id of the Asset Authorization Request.
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JumpAuthorizationRequest'
  /jump-approval/approve:
    post:
      summary: Answer an Asset Authorization Request.
      description: Approve or Deny an Asset Authorization Request.
      operationId: api.config.jump-approval.approve
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The unique identifier assigned to the Asset Authorization Request.
                user_id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The unique identifier assigned to the approving User.
                answer:
                  type: string
                  enum: [approved, denied]
                  description: The status to assign to the Asset Authorization Request.
                comments:
                  type: string
                  maxLength: 2048
                  description: Approving User's comments for their answer.
              required:
                - id
                - user_id
                - answer
        required: true
      responses:
        '400':
          description: The Approval was not successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
