                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The unique identifier assigned to the requesting User.
                jump_item_type:
                  type: string
                  description: The Asset's type.
                jump_item_id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The Asset's id.
                start:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                  description: Unix timestamp (in seconds) from which the request should start. Defaults to the current time.
                duration:
                  type: integer
                  minimum: 60
                  maximum: 2147483647
                  default: 7200
                  description: Duration (in seconds) that the request should last.
