      description: In a paginated response, this header provides URLs for first, next, previous, and last pages for the current resource type and the given request parameters.
      schema:
        type: string
        example: |
          (Newlines added for readability.)

          Link: <https://pf34d701.beyondtrustcloud.com/api/config/user?per_page=10&current_page=1>; rel="first",
          <https://pf34d701.beyondtrustcloud.com/api/config/user?per_page=10&current_page=6>; rel="previous",
