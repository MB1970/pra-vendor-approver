    Jumpoint:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to this Gateway by the appliance. This value must be unique.
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The display name of the Gateway. This value must be unique.
        platform:
          type: string
          description: "The platform of the Gateway. This attribute cannot be modified after the Gateway is created."
          enum: [windows-x86, linux-x86]
        code_name:
          $ref: '#/components/schemas/CodeName'
        comments:
          type: string
          minLength: 0
          maxLength: 1024
          description: The Gateway's comments.
        enabled:
          type: boolean
          default: true
          description: If true, the Gateway is enabled.
        connected:
          type: boolean
          default: true
          readOnly: true
          description: If true, the Gateway is connected to the appliance.
        clustered:
          type: boolean
          default: false
          description: If true, the Gateway can have more than one node. This attribute cannot be modified after the Gateway is created.
        shell_jump_enabled:
          type: boolean
          default: false
          description: If true, users are allowed to start SSH sessions with the Gateway.
        external_jump_item_network_id:
          type: string
          maxLength: 1024
          minLength: 0
          description: This field is only applicable when the option 'Allow Search for External Assets.' is Enabled in Management -> Security. The value must be unique if it is not empty.
        rdp_service_account_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          default: null
          nullable: true
          description: The unique identifier of the Vault account through which RDP sessions can also receive additional audit capabilities. It must be an generic account or a domain account.
        protocol_tunnel_enabled:
          type: boolean
          default: true
          description: If true, users are allowed to start Protocol Tunnel sessions with the Gateway.
        network_tunnel_consent_enabled:
          type: boolean
          default: true
          description: If true, users are required to approve TCP/UDP connections traversing active Network Tunnels.
        managed_ip_ranges:
          type: array
          description: An array of dotted-decimal IPv4 address ranges that should be managed by the network tunnel service on this Gateway. If the Network Tunnel feature will be used on one or more networks which do not provide a DHCP service, provide ranges from which allocations can be made for access sessions. An IP address for each network that the filter rules of a Protocol Tunnel Asset allows will be allocated to a user while participating in a session. Take care to provide ranges that do not contain IP addresses which could be used by other systems on that network.
          default: []
          example: '[ { "start": "192.168.1.1", "end": "192.168.1.24" }, { "start": "10.10.11.12", "end": "10.10.11.124" } ]'
          items:
            $ref: '#/components/schemas/IPRange'
        jzp_enabled:
          type: boolean
          default: false
          description: Indicates whether the Proxy feature is enabled. This value can be null in responses for Gateways created before an upgrade until the Gateway connects for the first time after the upgrade.
        jzp_proxy_hostname:
          type: string
          default: ''
          maxLength: 256
          minLength: 0
          description: The hostname of the Proxy server. This parameter is only used for standalone Gateways and is only valid if the Proxy feature is enabled. This value can be null in responses for Gateways created before an upgrade until the Gateway connects for the first time after the upgrade.
        jzp_proxy_port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          default: 9555
          description: TCP Port of the Proxy. Only valid when the Proxy feature is enabled. This value can be null in responses for Gateways created before an upgrade until the Gateway connects for the first time after the upgrade.
        jzp_allow_http_get:
          type: boolean
          default: false
          description: If enabled, HTTP GET requests are permitted through the proxy to the BeyondTrust appliance, and this setting is only applicable if the Proxy feature is enabled. This value can be null in responses for Gateways created before an upgrade until the Gateway connects for the first time after the upgrade.
        jzp_client_address_restrictions_type:
          type: string
          enum: ['no_restriction', 'allow_all', 'deny_all']
          description: 'The type of client address restrictions to apply to the JZP. If set to `no_restriction`, the `jzp_restricted_ips` field is ignored. If set to `allow_all`, the `jzp_restricted_ips` field is used to specify a list of allowed network address prefixes. If set to `deny_all`, the `jzp_restricted_ips` field is used to specify a list of denied network address prefixes.'
          default: 'no_restriction'
        jzp_restricted_ips:
          type: array
          description: Array of network address prefixes, where netmasks are optional and can be specified in either dotted-decimal or integer bitmask format. If a netmask is omitted, the entry is assumed to be a single IP address. This field is only valid if the jzp_client_address_restrictions_type is set to `allow_all` or `deny_all`.
          default: []
          example: '["192.168.0.0/255.255.0.0", "192.168.100.0/24", "192.168.100.16", "fe80:0:0:0:0:0:0:0/16"]'
          items:
            type: string
        docker_deploy_key:
          type: string
          readOnly: true
          description: The value to provide to the Gateway Docker image as the DEPLOY_KEY environment variable. This value will only be set for Linux Gateways that have clustered set to true.
        key_info:
          type: string
          readOnly: true
          description: The key info of the Gateway Installer.
      required:
        - name
        - platform
    JumpointNode:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          readOnly: true
          description: The unique identifier assigned to this Gateway node by the appliance.
        last_connect_timestamp:
          type: string
