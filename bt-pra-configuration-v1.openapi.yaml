    AccountJumpItemAssociation:
      type: object
      description: Describes Asset association criteria for Vault Accounts and Account Groups. The `criteria` property is only allowed if the `filter_type` is "criteria".
      properties:
        filter_type:
          type: string
          enum: [any_jump_items, no_jump_items, criteria]
          description: |
            The following values are allowed:

            - `any_jump_items`: The account(s) can be injected within any session started from an Asset where the account(s) is/are applicable.
            - `no_jump_items`: The account(s) cannot be injected into any session started from an Asset.
            - `criteria`: The account(s) can be injected only within sessions started from Assets that match the criteria you define, where the account is applicable. This uses the given `criteria` and `jump_items` to identify which Assets the applicable account(s) should be associated with.
        criteria:
          $ref: '#/components/schemas/AccountJumpItemAssociationCriteria'
        jump_items:
          type: array
          description: Array of identifiers for Assets that should be directly associated with the account(s).
          items:
            $ref: '#/components/schemas/AccountInjectableJumpItem'
      required:
        - filter_type

