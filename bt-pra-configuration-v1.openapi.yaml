  /vault/account/{id}/jump-item-association:
    get:
      summary: Get Asset association criteria.
      description: |
        Get the Asset association criteria for the Account or AWS Secret with the given `{id}`.

        This API cannot be used if the Account or Secret is inheriting Asset association criteria from its Account Group. Instead, query its Account Group's associations using the <a href="#api.config.vault.account-group.jump-item-association.show">Account Group's GET API for Asset associations</a>.
      operationId: api.config.vault.account.jump-item-association.show
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpItemAssociation'
    post:
      summary: Add Asset association criteria.
      description: |
        For an account or secret that has no explicit Asset associations defined and is currently inheriting association criteria from its Account Group, this API will add Asset association criteria for the Account or Secret with the given `{id}` using the data in the request body. This should be used only if the Account does not already have any Asset association defined.

        If you set the `filter_type` to "criteria", then you must provide some properties in the `criteria` field. You may specify some or all of the available `criteria` properties. Once you have created association criteria with this POST API, separate APIs exist for adding or deleting single Asset or shared Asset Group ids from their respective lists in `criteria`, which might be preferable to supplying the entire array of ids up front with this API:

        - <a href="#api.config.vault.account.jump-item-association.jump-item.store">Add a single Asset to `jump_items`.</a>
        - <a href="#api.config.vault.account.jump-item-association.jump-item.destroy">Remove a single Asset from `jump_items`.</a>
        - <a href="#api.config.vault.account.jump-item-association.shared-jump-group.store">Add a single Asset Group to `shared_jump_groups`.</a>
        - <a href="#api.config.vault.account.jump-item-association.shared-jump-group.destroy">Remove a single Asset Group from `shared_jump_groups`.</a>

        If the `filter_type` is set to "any_jump_items" or "no_jump_items", the `criteria` field will be ignored.

        Once you have used this API to add Asset association criteria, use the <a href="#api.config.vault.account.jump-item-association.update">PATCH API</a> to change the `filter_type` and / or `criteria`. To change this Account or Secret back to inheriting Asset association criteria from its Account Group, use the <a href="#api.config.vault.account.jump-item-association.destroy">DELETE API</a>.

        This API cannot be used if the Account or Secret already has Asset association criteria defined. If you wish to update the current Asset association criteria, use the <a href="#api.config.vault.account.jump-item-association.update">PATCH API</a> instead.
      operationId: api.config.vault.account.jump-item-association.store
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountJumpItemAssociation'
        required: true
      responses:
        '201':
          description: The Asset association criteria were created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpItemAssociation'
    patch:
      summary: Update the Asset association criteria.
      description: |
        Update the Asset association criteria for the Account or Secret with the given `{id}` using the data in the request body.

        You may change either or both of the `filter_type` and `criteria` properties of the association object in a single request, but `criteria` will be ignored if the `filter_type` is not set to "criteria". Updating `filter_type` from "criteria" to "any_jump_items" or "no_jump_items" implicitly deletes all previous `criteria` for the account or secret.

        If you want the account to inherit associations from its Account Group you must use the endpoint:

        - <a href="#api.config.vault.account.jump-item-association.destroy">Delete Asset association criteria for an Account.</a>

        You may specify some or all of the available `criteria` properties. Each `criteria` property you supply will *replace* the previous value for that property. To keep the existing values for a certain property, omit that property from the request. Separate APIs exist for adding or deleting single Assets or shared Asset Groups, which might be preferable to supplying the entire array of ids with this API:

        - <a href="#api.config.vault.account.jump-item-association.jump-item.store">Add a single Asset to `jump_items`.</a>
        - <a href="#api.config.vault.account.jump-item-association.jump-item.destroy">Remove a single Asset from `jump_items`.</a>
        - <a href="#api.config.vault.account.jump-item-association.shared-jump-group.store">Add a single Asset Group to `shared_jump_groups`.</a>
        - <a href="#api.config.vault.account.jump-item-association.shared-jump-group.destroy">Remove a single Asset Group from `shared_jump_groups`.</a>

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined. To create association criteria specifically for this Account or Secret, use the <a href="#api.config.vault.account.jump-item-association.store">POST API</a> instead.
      operationId: api.config.vault.account.jump-item-association.update
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountJumpItemAssociation'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountJumpItemAssociation'
    delete:
      summary: Delete Asset association criteria.
      description: |
        For an Account or Secret with the given `{id}` that has Asset associations defined, this API removes those associations so that the Account or Secret begins inheriting associations from its Account Group instead.

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined, since there is nothing to delete.
      operationId: api.config.vault.account.jump-item-association.destroy
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Indicates that the Asset association was successfully deleted.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
  /vault/account/{id}/jump-item-association/jump-item:
    post:
      summary: Add an Asset to the association criteria.
      description: |
        Adds a specific Asset identified in the request body to the Asset association criteria of the Account or Secret with the given `{id}`.

        The Account or Secret Asset association must have its `filter_type` set to "criteria".

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined. To create association criteria specifically for this Account or Secret, use the <a href="#api.config.vault.account.jump-item-association.store">POST API</a> instead.

        Currently Remote Assets cannot be added.
      operationId: api.config.vault.account.jump-item-association.jump-item.store
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        description: Identifies the Asset to add.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInjectableJumpItem'
        required: true
      responses:
        '200':
          description: Indicates the Asset was successfully added to the Account or Secret Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    delete:
      summary: Remove an Asset from the Asset association criteria.
      description: |
        Removes a specific Asset identified in the request body from the Asset association criteria of the Account or Secret with the given `{id}`.

        The Account or Secret Asset association must have its `filter_type` set to "criteria".

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined. To create association criteria specifically for this Account or Secret, use the <a href="#api.config.vault.account.jump-item-association.store">POST API</a> instead.
      operationId: api.config.vault.account.jump-item-association.jump-item.destroy
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        description: Identifies the Asset to remove.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInjectableJumpItem'
        required: true
      responses:
        '204':
          description: Indicates the Asset was successfully removed from the Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
  /vault/account/{id}/jump-item-association/shared-jump-group:
    post:
      summary: Add a shared Asset Group to the Asset association criteria.
      description: |
        Adds a specific shared Asset Group identified by `shared_jump_group_id` in the request body to the Asset association criteria of the Account or Secret with the given `{id}`.

        The Asset association must have its `filter_type` set to "criteria".

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined. To create association criteria specifically for this Account or Secret, use the <a href="#api.config.vault.account.jump-item-association.store">POST API</a> instead.
      operationId: api.config.vault.account.jump-item-association.shared-jump-group.store
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shared_jump_group_id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The unique identifier assigned to the shared Asset Group by the system.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Indicates the shared Asset Group was successfully added to the Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    delete:
      summary: Remove a shared Asset Group from the Asset association criteria.
      description: |
        Removes a specific shared Asset Group identified by `{shared_jump_group_id}` from the Asset association criteria of the Account or Secret with the given `{id}`.

        The Account's Asset association must have its `filter_type` set to "criteria".

        This API cannot be used if the given Account or Secret is inheriting Asset association criteria from its Account Group and does not have any of its own Asset associations defined. To create association criteria specifically for this Account or Secret, use the <a href="#api.config.vault.account.jump-item-association.store">POST API</a> instead.
      operationId: api.config.vault.account.jump-item-association.shared-jump-group.destroy
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shared_jump_group_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Unique identifier for the shared Asset Group.
        required: true
      responses:
        '204':
          description: Indicates the shared Asset Group was successfully removed from the Asset association criteria.
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /vault/endpoint:
    get:
      summary: Get a list of Vault Endpoints.
      description: |
        Gets a paginated list of all Vault endpoints. They can optionally be filtered using query string parameters documented below.

        If no filter criteria are specified then all Vault endpoints are returned.

        String parameters are always matched case-insensitively and exactly. No partial matches are allowed.

      operationId: api.config.vault.endpoint.index
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CurrentPageParam'
        - in: query
          name: name
          description: Filters results to include only endpoints that match the given name.
          schema:
            type: string
            maxLength: 128
            minLength: 1
        - in: query
          name: hostname
          description: Filters results to include only endpoints that match the given hostname.
          schema:
            type: string
            maxLength: 128
            minLength: 1
        - in: query
          name: description
          description: Filters results to include only endpoints that match the given description.
          schema:
            type: string
            maxLength: 1024
        - in: query
          name: domain_name
          description: Filters results to include only endpoints that match the given domain name.
          schema:
            type: string
            maxLength: 255
            minLength: 1
      responses:
        '200':
          description: OK
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-BT-Pagination-Current-Page:
              $ref: '#/components/headers/X-BT-Pagination-Current-Page'
            X-BT-Pagination-Per-Page:
              $ref: '#/components/headers/X-BT-Pagination-Per-Page'
            X-BT-Pagination-Last-Page:
              $ref: '#/components/headers/X-BT-Pagination-Last-Page'
            X-BT-Pagination-Total:
              $ref: '#/components/headers/X-BT-Pagination-Total'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VaultEndpoint'

  /vault/endpoint/{id}/remote-rdp-jump-item-candidates:
    get:
